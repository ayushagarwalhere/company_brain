name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.1  # pinned: the version the test suite passes against
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FALKORDB_HOST: localhost
      FALKORDB_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff==0.6.9 mypy==1.11.2
      - name: Lint and format check (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Type check pipeline/ and graph/ (mypy)
        run: python -m mypy
      - name: Unit, graph and API tests (no LLM, no API keys)
        run: python -m pytest -q
      - name: Ablation study (fails if the full graph loses drift P/R 1.00 or version reasoning stops mattering)
        run: python -m benchmark.ablation
      - name: Build the demo graph and check query plans use indexes
        run: |
          python -m pipeline.build --extractor heuristic
          python -m scripts.explain_queries
      - name: Stress test (small, keeps CI fast)
        run: python -m benchmark.scale --features 40 --noise 4000
      - name: Query reference is up to date
        run: |
          python -m scripts.export_queries
          git diff --exit-code docs/QUERIES.md

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
